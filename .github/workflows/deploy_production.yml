name: Deploy Production Release

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install PHP and composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install Node.js and npm
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction
          rm .env
          npm install --force

      - name: Upload Files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          overwrite: true
          source: './*'
          target: '/root/system/mhb'

      - name: Update Docker Container
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /root/system/mhb
            chmod -R 777 storage
            rm -rf storage/logs/*
            chmod -R 777 lrgs
            docker rm -f 'mhb' || true
            docker rm -f 'mhb_queue' || true
            docker rm -f 'mhb_cron' || true
            docker compose -f docker-compose.production.yml -p mhb up -d --build --force-recreate --remove-orphans

      - name: Update Database and Link File Storage
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            docker exec mhb php artisan migrate --force
            docker exec mhb php artisan optimize:clear
            docker exec mhb php artisan storage:link
            docker exec mhb php -d memory_limit=512M artisan scribe:generate
