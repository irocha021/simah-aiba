upload_max_filesize = 50M
post_max_size = 50M

; 128M obrigava o deploy a chamar `php -d memory_limit=512M artisan
; scribe:generate` para não estourar. O limite vale por processo PHP; o pico
; real da importação de camadas acontece em processos externos (ogr2ogr,
; gdal2tiles), que não respondem a esta diretiva.
memory_limit = 512M

max_execution_time = 300
